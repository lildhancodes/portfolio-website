    <!-- Apply the saved theme before first paint. Same storage key as the Framer theme switch,
         so returning visitors keep their choice. Defaults to dark like the original. -->
    <script>
      try {
        var t = localStorage.getItem('currentToggleState')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
